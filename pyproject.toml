[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pq-pytest"
version = "0.1.0"
description = "Test Power Query M code with pytest - no Excel required"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = [
    "power-query",
    "m-language",
    "testing",
    "pytest",
    "excel",
    "power-bi",
    "etl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "pandas>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pandas-stubs",
]

[project.scripts]
pq = "pq_pytest.cli:main"

[project.entry-points.pytest11]
pq_pytest = "pq_pytest.plugin"

[project.urls]
Homepage = "https://github.com/yourusername/pq-pytest"
Documentation = "https://github.com/yourusername/pq-pytest#readme"
Issues = "https://github.com/yourusername/pq-pytest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pq_pytest"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
