[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pq-pytest"
version = "0.1.0"
description = "Test Power Query M code with pytest - no Excel required"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["powerquery", "pytest", "testing", "m-language", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "pandas>=1.5",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/pq-pytest"
Repository = "https://github.com/YOUR_USERNAME/pq-pytest"
Issues = "https://github.com/YOUR_USERNAME/pq-pytest/issues"

[project.scripts]
pq = "pq_pytest.cli:main"

[project.entry-points.pytest11]
pq_pytest = "pq_pytest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["pq_pytest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
